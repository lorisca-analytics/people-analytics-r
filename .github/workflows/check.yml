name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("readr", "dplyr", "tidyr", "broom", "sandwich", "lmtest", "ggplot2", "testthat"))'
      - name: Download data and verify checksums
        run: Rscript get_data.R
      - name: Run all analyses
        run: Rscript run_all.R
      - name: Data-check tests and README numbers match the run
        run: Rscript tests/run_tests.R
      # results.txt carries version strings and console formatting that differ by machine,
      # so the check compares the numbers file only.
      - name: Committed key numbers match a fresh run
        run: git diff --exit-code -- outputs/key_numbers.csv
